[package]
name = "beatbyte-game"
description = "BeatByte presentation layer: Bevy plugins for gameplay, rendering, UI and effects."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
beatbyte-core = { workspace = true }
beatbyte-chart = { workspace = true }
beatbyte-audio = { workspace = true }
beatbyte-editor = { workspace = true }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
ureq = { workspace = true }
rusb = { workspace = true }
beatbyte-ml = { workspace = true, optional = true }

[features]
# Local ML models (ADR-0013). Off by default; nothing in the game
# reaches for a model unless this is on AND the user asked.
ml = ["dep:beatbyte-ml"]

[lints]
workspace = true
